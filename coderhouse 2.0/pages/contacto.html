<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Overclock Hardware Store</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

    <header>
        <h1>Overclock Hardware Store</h1>
        <nav>
            <ul>
                <li><a class="enlace" href="../index.html">Inicio</a></li>
                <li><a class="enlace" href="productos.html">Productos</a></li>
                <li><a class="enlace" href="servicios.html">Servicios</a></li>
                <li><a class="enlace" href="nosotros.html">Nosotros</a></li>
                <li><a class="enlace" href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="seccion-contacto">
            <h2>Contacto</h2>
            <p>
                Si tenés alguna consulta, podés comunicarte
                con nosotros mediante el siguiente formulario.
            </p>

            <form class="formulario">
                <div class="campo-form">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="campo-form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="campo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje"></textarea>
                </div>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p class="texto-footer">Overclock Hardware Store</p>
        <p class="texto-footer">Todos los derechos reservados.</p>
    </footer>

</body>

</html>
